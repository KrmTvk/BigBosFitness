<style>
:root{--bg:#000;--card:#0f0f10;--card2:#18181a;--line:#242426;--tx:#f2f2f3;--mu:#8a8a90;--ac:#ff3b30;--ok:#30d158;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}button{font-family:inherit;touch-action:manipulation}input,select{-webkit-appearance:none;appearance:none;font-family:inherit}.day,.chip,.ck,.th{cursor:pointer;-webkit-user-select:none;user-select:none}.days{-webkit-overflow-scrolling:touch;scrollbar-width:none}.days::-webkit-scrollbar{display:none}body{min-height:100vh;min-height:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;padding-bottom:150px;max-width:520px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:10}
header{padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:flex-end}
h1{margin:0;font-size:26px;letter-spacing:-.5px}h1 b{color:var(--ac)}
.sub{color:var(--mu);font-size:12px}
.days{display:flex;gap:8px;overflow-x:auto;padding:8px 18px}
.day{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:14px;padding:8px 14px;text-align:center;font-size:12px}
.day b{display:block;color:var(--tx);font-size:14px}
.day.on{background:var(--ac);border-color:var(--ac);color:#fff}.day.on b{color:#fff}
.sec{padding:6px 18px}
.chips{display:flex;gap:6px;align-items:center;margin:6px 0 10px;color:var(--mu);font-size:12px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:20px;padding:5px 11px;font-size:12px}
.chip.on{border-color:var(--ac);color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ex{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ex svg{width:64px;height:40px;flex:0 0 64px;background:var(--card2);border-radius:10px;padding:2px}
.ex h3{margin:0;font-size:16px}.th{position:relative;flex:0 0 auto}.th img{width:96px;height:64px;object-fit:contain;background:#fff;border-radius:10px;display:block}#ov{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}#ov img{max-width:100%;max-height:62vh;background:#fff;border-radius:14px}#ov button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 16px;font-size:14px}.th i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:11px;background:#000;border:1px solid var(--line);border-radius:8px;padding:1px 4px}.ex p{margin:2px 0 0;color:var(--mu);font-size:12px}
.set{display:grid;grid-template-columns:24px 58px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:7px}.set .pv{font-size:12px;color:var(--mu)}
.set span{color:var(--mu);font-size:13px;text-align:center}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:16px;text-align:center;outline:none}
input:focus,select:focus{border-color:var(--ac)}
.ck{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mu);font-size:18px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#000}
.lab{display:grid;grid-template-columns:24px 58px 1fr 1fr 44px;gap:8px;color:var(--mu);font-size:11px;text-align:center}
h2{font-size:17px;margin:4px 0 10px}
.btn{width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label{font-size:12px;color:var(--mu)}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}.mu{color:var(--mu)}.up{color:var(--ok)}.dn{color:var(--ac)}
.stat{display:flex;gap:10px;margin-bottom:12px}.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:rgba(10,10,10,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;padding:4px}nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--ac)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:#1c1c1e;border:1px solid var(--ac);border-radius:18px;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:30}
#rest .t{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
#rest button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 11px;font-size:13px}
svg text{fill:#8a8a90;font-size:10px}
.empty{color:var(--mu);text-align:center;padding:18px;font-size:13px}
.top{display:flex;align-items:center;gap:14px}.top svg text{font-size:15px}
.ft{display:flex;gap:8px;margin-top:10px}.ft button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px;font-size:13px}
.note{margin-top:8px;text-align:left;font-size:14px;padding:9px 11px}
#toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:492px;margin:0 auto;background:#1c1c1e;border:1px solid #ffd60a;color:#ffd60a;border-radius:14px;padding:12px 14px;font-weight:600;z-index:60;display:none;text-align:center}
#sm{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:55;display:none;flex-direction:column;justify-content:center;padding:20px;max-width:520px;margin:0 auto}#sm h2{font-size:24px;text-align:center}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hm .hl{font-size:10px;color:var(--mu);text-align:center}.hc{aspect-ratio:1;border-radius:7px;font-size:10px;color:#ccc;display:flex;align-items:center;justify-content:center}.hc.tdy{outline:2px solid #f2f2f3}
.seg{display:flex;gap:6px;margin:10px 0 0}

.set.wu .pv{color:#ff9f0a}.set.wu .wx{color:#ff9f0a;font-size:13px}.set.wu .ck.on{background:#ff9f0a;border-color:#ff9f0a}.row{gap:10px}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
textarea{width:100%;min-height:70px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:13px;margin-top:10px}.hc.sel{outline:2px solid var(--ac)}
.card label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}.ed input{text-align:left}.ed .grid input{text-align:center}.ed .btn.gh{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.coach-card{display:flex;align-items:flex-end;gap:10px;margin:0 0 12px}.coach-card svg{flex:0 0 auto;cursor:pointer}
.bub{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.35;position:relative;margin-bottom:10px}.bub:before{content:"";position:absolute;left:-7px;bottom:16px;width:12px;height:12px;background:var(--card2);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}.bub b{display:block;color:var(--ac);font-size:11px;letter-spacing:.4px;margin-bottom:2px}
.cb{animation:bob 3s ease-in-out infinite}.ce{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-2px)}}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tc{text-align:center;padding:24px 14px}.tc.w{border-color:var(--ac)}.tc.r{border-color:var(--ok)}.tp{font-size:28px;font-weight:700;margin:6px 0}.tc.w .tp{color:var(--ac)}.tc.r .tp{color:var(--ok)}.tl{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 14px}
#cpill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;background:#1c1c1e;border:1px solid var(--ac);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;z-index:40;display:none}
.kp{display:flex;gap:12px;align-items:flex-start}.kp .ic{font-size:30px;line-height:1}.kp h3{margin:0;font-size:16px}.kp p{margin:3px 0 8px;color:var(--mu);font-size:13px;line-height:1.35}.ks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
nav button{padding:4px 0}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ag button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 6px;font-size:14px}.ag button b{display:block;font-size:24px;margin-bottom:2px}

 CT.iv=setInterval(cTick,250);S.tab='k';render();scrollTo(0,0)}
function cTick(){if(!CT||CT.pause!=null)return;const i0=CT.i;
 while(Date.now()>=CT.end){CT.i++;if(CT.i>=CT.st.length){cDone(true);return}CT.end+=CT.st[CT.i][1]*1000}
 if(CT.i!=i0){cue();if(S.tab=='k')render()}
 const left=Math.ceil((CT.end-Date.now())/1000);if(left<=3&&left>0&&CT.lb!=CT.i*10+left){CT.lb=CT.i*10+left;beep(660,.08)}cUI()}
function cUI(){const s=CT.st[CT.i],left=CT.pause!=null?Math.ceil(CT.pause/1000):Math.ceil((CT.end-Date.now())/1000),a=document.getElementById('ctl');if(a)a.textContent=hm(left);const b=document.getElementById('ctb');if(b)b.style.width=Math.min(100,100-left/s[1]*100)+'%';
 const pl=$('#cpill');if(S.tab!='k'){pl.style.display='block';pl.textContent=(s[2]=='w'?'🔥 ':'🟢 ')+s[0]+' '+hm(left)}else pl.style.display='none'}
function cEnd(){clearInterval(CT.iv);try{CT.wl&&CT.wl.release()}catch(e){}const n=CT.n;CT=null;$('#cpill').style.display='none';return n}
function cDone(full){const tot=tsum(CT.st),n=CT.n,id=CT.id,mn=Math.max(1,Math.round(tot/60));cEnd();addCr(n,mn,null,MT[id]||6,'t');say('🏃 Kardio tamam! '+mn+' dk '+n+'. '+rnd(MOTI),'h');toast('✅ '+n+' kaydedildi: '+mn+' dk');vib([200,100,200,100,400]);beep(784,.3);save();render()}
function cStop(){let el=0;for(let i=0;i<CT.i;i++)el+=CT.st[i][1];const left=CT.pause!=null?CT.pause/1000:(CT.end-Date.now())/1000;el+=CT.st[CT.i][1]-Math.max(0,left);const id=CT.id,n=cEnd();
 if(el>=60){const mn=Math.round(el/60);addCr(n,mn,null,MT[id]||6,'t');toast('Kaydedildi: '+mn+' dk '+n);save()}else toast('1 dakikadan kısa, kaydedilmedi');render()}
function cPause(){if(CT.pause!=null){CT.end=Date.now()+CT.pause;CT.pause=null}else CT.pause=Math.max(0,CT.end-Date.now());render()}
function cSkip(){CT.i++;if(CT.i>=CT.st.length){cDone(true);return}const d=CT.st[CT.i][1]*1000;if(CT.pause!=null)CT.pause=d;else CT.end=Date.now()+d;cue();render()}
function mlog(){const mn=parseInt(document.getElementById('kmin').value)||0,km=parseFloat(document.getElementById('kkm').value)||null;if(mn<=0){toast('Süreyi dakika olarak yaz');return}addCr(S.kt,mn,km,(ACT.find(a=>a.n==S.kt)||{met:5}).met,'m');say('Kardio kaydedildi: '+mn+' dk '+S.kt+'. '+rnd(MOTI),'h');save();render();toast('✅ Kaydedildi')}
function kdel(i){S.cr.splice(i,1);save();render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CT)cTick()});
function hdo(k){S.hd=S.hd==k?null:k;render()}
function mv(){const L=S.m.length?S.m[S.m.length-1]:{};
 let h=`<div class="sec"><div class="card"><h2>Yeni Ölçü</h2><div class="grid">${MS.map(([k,n])=>`<div><label>${n}</label><input id="m_${k}" type="number" inputmode="decimal" placeholder="${L[k]||''}"></div>`).join('')}</div><button class="btn" style="margin-top:12px" onclick="addM()">Kaydet</button></div>`+goalCard();
 const kg=S.m.filter(x=>x.kilo).slice(-8).map(x=>[x.date,x.kilo]);
 if(kg.length>1)h+=`<div class="card"><h2>Kilo Takibi</h2>${line(kg)}</div>`;
 h+=`<div class="card"><h2>Ölçü Geçmişi</h2>`;
 h+=S.m.length?S.m.slice().reverse().map((x,ri)=>{const i=S.m.length-1-ri,p=S.m[i-1];return `<div class="row" style="display:block"><b>${new Date(x.date+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}</b> <span class="mu" style="float:right" onclick="delM(${i})">Sil</span><div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13px">${MS.filter(([k])=>x[k]).map(([k,n])=>{const df=p&&p[k]?+(x[k]-p[k]).toFixed(1):0;return `<span><span class="mu">${n.split(' ')[0]}</span> ${x[k]}${df?` <span class="${(k=='kol'||k=='omuz'||k=='gogus'||k=='bacak')==(df>0)?'up':'dn'}">${df>0?'+':''}${df}</span>`:''}</span>`}).join('')}</div></div>`}).join(''):'<div class="empty">Henüz ölçü eklemedin.</div>';
 return h+`</div><div class="card"><h2>💾 Veri Yedeği</h2><div class="mu" style="font-size:13px">Verilerini başka bir cihaza ya da uygulamaya taşımak için kopyala, orada yapıştırıp yükle.</div><div class="ft"><button onclick="bkCopy()">Yedeği Kopyala</button><button onclick="bkLoad()">Yapıştırıp Yükle</button></div><textarea id="bkt" placeholder="Yedek metnini buraya yapıştır"></textarea></div></div>`}
function goalCard(){const base={},cur={};S.m.forEach(x=>MS.forEach(([k])=>{if(x[k]){if(base[k]==null)base[k]=x[k];cur[k]=x[k]}}));
 return `<div class="card"><h2>🎯 Hedefler</h2><div class="grid">${MS.map(([k,n])=>`<div><label>${n} hedef</label><input id="g_${k}" type="number" inputmode="decimal" placeholder="–" value="${S.goals[k]||''}"></div>`).join('')}</div><button class="btn" style="margin-top:12px" onclick="saveG()">Hedefleri Kaydet</button>${MS.filter(([k])=>S.goals[k]&&cur[k]!=null).map(([k,n])=>{const g=S.goals[k],b=base[k],c=cur[k],t=g-b,pc=t==0?100:Math.max(0,Math.min(100,(c-b)/t*100));return `<div style="margin-top:14px"><div class="row" style="border:0;padding:0 0 6px"><span>${n}</span><span class="mu">${c} → ${g} (%${Math.round(pc)})</span></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join('')}</div>`}
function saveG(){MS.forEach(([k])=>{const v=parseFloat($('#g_'+k).value);if(v)S.goals[k]=v;else delete S.goals[k]});save();render();toast('🎯 Hedefler kaydedildi')}
function bk(){const o={};['h','m','xs','notes','dur','wr','wu','goals','img','day','rest','prog','pname','cr','cg','cc'].forEach(k=>o[k]=S[k]);return JSON.stringify(o)}
async function bkCopy(){try{await navigator.clipboard.writeText(bk());toast('✅ Yedek kopyalandı')}catch(e){const t=$('#bkt');t.value=bk();t.select();toast('Metni elle kopyala')}}
function bkLoad(){try{const o=JSON.parse($('#bkt').value);if(!o||!Array.isArray(o.h))throw 0;Object.assign(S,o);if(Array.isArray(o.prog)&&o.prog.length)P=S.prog=o.prog;S.h.forEach(x=>{if(!x.n)x.n=exName(x.ex)});save();render();toast('✅ Yedek yüklendi')}catch(e){toast('⚠️ Geçersiz yedek')}}
function addM(){const o={date:td()};let any=0;MS.forEach(([k])=>{const v=parseFloat($('#m_'+k).value);if(v){o[k]=v;any=1}});if(!any)return;S.m.push(o);save();render()}
function delM(i){S.m.splice(i,1);save();render()}
let ovP=[0,0];
function show(d,j){const n=P[d].ex[j][0],u=S.img[n]||IMG[n];if(!u){pick(d,j);return}ovP=[d,j];$('#ovi').src=u;$('#ovt').textContent=n;$('#ov').style.display='flex'}
function pick(d,j){const n=P[d].ex[j][0],f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{if(!f.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img[n]=c.toDataURL('image/jpeg',.7);save();render()};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();scrollTo(0,0)});
render();
try{if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
